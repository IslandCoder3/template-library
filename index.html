<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template library</title>
<script>
(function () {
	try {
		var saved = localStorage.getItem('tl_theme');
		var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
		document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
	} catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="tl_top">
	<div class="tl_wrap tl_top__in">
		<a class="tl_brand" href="#" aria-label="Template library, all templates">
			<svg class="tl_brand__mark" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="currentColor"/><path d="M14 11l-6 6 6 6M20 11l6 6-6 6" fill="none" stroke="#ffd23f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
			<span class="tl_brand__name">Template library</span>
		</a>
		<div class="tl_top__right">
			<span class="tl_top__count" id="tl_count"></span>
			<button type="button" class="tl_iconbtn" id="tl_theme" aria-label="Switch between light and dark theme" title="Switch theme">
				<svg class="tl_icon tl_icon--moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
				<svg class="tl_icon tl_icon--sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
			</button>
		</div>
	</div>
</header>

<main id="tl_view"></main>

<div class="tl_toast" id="tl_toast" role="status" aria-live="polite"></div>

<script src="assets/jszip.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
